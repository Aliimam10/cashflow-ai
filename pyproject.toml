[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cashflow-ai"
version = "0.1.0"
description = "Local-first personal cash-flow forecasting and financial insight system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "CashFlow AI contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.141,<1",
    "joblib>=1.5,<2",
    "pdfplumber>=0.11,<1",
    "pillow>=11,<13",
    "pydantic-settings>=2.10,<3",
    "pymupdf>=1.26,<2",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.32,<1",
    "pyyaml>=6,<7",
    "scikit-learn>=1.7,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52,<1",
]

[project.scripts]
cashflow-anomaly-demo = "cashflow_ai.anomalies.demo:main"
cashflow-forecast-demo = "cashflow_ai.forecasting.demo:main"
cashflow-forecast-model-demo = "cashflow_ai.forecasting.model_demo:main"
cashflow-forecast-path-demo = "cashflow_ai.forecasting.path_demo:main"
cashflow-model-registry-demo = "cashflow_ai.model_registry.demo:main"
cashflow-planning-demo = "cashflow_ai.planning.demo:main"
cashflow-scenario-demo = "cashflow_ai.planning.scenario_demo:main"
cashflow-invalidation-demo = "cashflow_ai.invalidation.demo:main"
cashflow-api = "cashflow_ai.api.cli:main"
cashflow-api-demo = "cashflow_ai.api.demo:main"

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cashflow_ai"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=cashflow_ai",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=100",
]
filterwarnings = [
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cashflow_ai"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PT",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
