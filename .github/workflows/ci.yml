name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.0"

      - name: Install Python
        run: uv python install 3.12.13

      - name: Sync locked development environment
        run: uv sync --frozen --dev

      - name: Check Ruff formatting
        run: make format-check

      - name: Run Ruff linting
        run: make lint

      - name: Run strict mypy
        run: make typecheck

      - name: Run pytest with 100% statement and branch coverage
        run: make test

      - name: Check package import
        run: make check-import

      - name: Exercise SQLite migrations
        env:
          CASHFLOW_DATABASE_URL: sqlite:////tmp/cashflow-ci.db
          CASHFLOW_ENVIRONMENT: test
        run: |
          make db-upgrade
          make db-downgrade
          make db-upgrade

  container:
    name: Container build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build the local application image
        run: docker build --tag cashflow-ai:ci .

      - name: Check the packaged Python import
        run: >-
          docker run --rm --entrypoint python cashflow-ai:ci
          -c "import cashflow_ai; print(cashflow_ai.__version__)"

      - name: Check the local OCR executable
        run: docker run --rm --entrypoint tesseract cashflow-ai:ci --version
